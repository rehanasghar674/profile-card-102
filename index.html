<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" /> 
    <link rel="stylesheet" href="profile-card.css">
  </head> 
  
<body> 

  <div class="card"> 
             <div class="upload-icon">
                  <i class="fa-solid fa-arrow-up-from-bracket up-icon"></i>
             </div>
         <div class="content1">
                <img src="profile-man-pic.jpeg" alt="pic">
         </div>
         <div class="content2">
               <h2>Mr. William</h2> 
               <p>Product Designer</p>
         </div>
         <div class="content3">
              <p>Figma</p> 
              <p>UX Design</p>
         </div> 
         <div class="content4">
               <div class="rating-text1">
                      <div class="text1">
                        <i class="fa-solid fa-star"></i> &thinsp;
                        <p>4.5</p>
                      </div>
                      <div class="text2">
                          <p>Rating</p>
                      </div>
               </div>
               <div class="rating-text2">
                 <div class="text3"> 
                        <p>$15K+</p>
                      </div>
                      <div class="text4">
                          <p>Earned</p>
                      </div>
               </div>
               <div class="rating-text3">
                     <div class="text5"> 
                        <p>$80/hr</p>
                      </div>
                      <div class="text6">
                          <p>Rate</p>
                      </div>
               </div>
         </div> 
         <div class="footer-div">
               <div class="button-div">
                <button>Get In Touch</button>
               </div> 
               <div class="bookmark-icon">
                   <i class="fa-regular fa-bookmark"></i>
               </div>
         </div>
  </div>


</body>

</html>
